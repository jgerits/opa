name: Publish Test Image to GHCR

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Full image name (for example ghcr.io/<owner>/opa-test)"
        required: true
        type: string
      image_tag:
        description: "Image tag to publish (defaults to short commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-linux-binaries:
    name: Build Linux Binaries (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Linux binaries
        env:
          GOARCH: ${{ matrix.goarch }}
        run: make ci-go-ci-build-linux ci-go-ci-build-linux-static

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux-${{ matrix.goarch }}
          path: _release/opa_linux_${{ matrix.goarch }}*

  publish-ghcr:
    name: Publish to GHCR
    needs: build-linux-binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-linux-*
          merge-multiple: true
          path: _release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Select image tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "IMAGE_TAG=$INPUT_TAG" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Build and push multi-arch images
        env:
          DOCKER_IMAGE: ${{ inputs.image_name }}
          VERSION: ${{ env.IMAGE_TAG }}
        run: make push-manifest-list-${VERSION}
